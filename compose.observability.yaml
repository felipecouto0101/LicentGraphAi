name: licitgraphai-observability
services:
  init-storage:
    image: busybox:1.37.0
    command: [sh, -c, 'chown -R 10001:10001 /tempo /loki']
    volumes:
      - tempo-data:/tempo
      - loki-data:/loki
    restart: 'no'
  alloy:
    image: grafana/alloy:v1.20.1
    command: [run, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    ports:
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:12345:12345'
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.15.0
    command: [--config.file=/etc/prometheus/prometheus.yaml, --web.enable-remote-write-receiver, --storage.tsdb.retention.time=7d]
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
  loki:
    image: grafana/loki:3.7.8
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    depends_on:
      init-storage: {condition: service_completed_successfully}
    restart: unless-stopped
  tempo:
    image: grafana/tempo:3.1.0
    command: [-target=all, -config.file=/etc/tempo/config.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      init-storage: {condition: service_completed_successfully}
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.3
    ports: ['127.0.0.1:3000:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped
volumes:
  alloy-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
