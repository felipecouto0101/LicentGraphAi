[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
# Check syntax, undefined names, unused imports and other Pyflakes diagnostics.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: loads real embedding models and ChromaDB"]
