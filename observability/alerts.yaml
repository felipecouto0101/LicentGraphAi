groups:
  - name: licitgraphai
    rules:
      - alert: AnalysisFailures
        expr: increase(licit_operations{stage=~"job.*",outcome="error"}[10m]) > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: Falha no processamento de uma análise
      - alert: CollectorUnavailable
        expr: up{job="alloy"} == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: Alloy indisponível para coleta
