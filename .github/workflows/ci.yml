name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.9
      - run: mkdir -p reports
      - name: Check Python diagnostics
        run: ruff check app tests scripts start_app.py --output-format json --output-file reports/ruff.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ruff-report
          path: reports/ruff.json
          retention-days: 7

  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      LANGCHAIN_TRACING_V2: 'false'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      GROQ_API_KEY: ''
      NODE3_MOCK_MODE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip check
      - run: python -m pytest tests -m "not integration" --junitxml=reports/tests.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-report
          path: reports/tests.xml
          retention-days: 7

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.9.4
      - run: python -m compileall -q app scripts start_app.py
      - run: mkdir -p reports
      - name: Collect all findings
        run: bandit -r app scripts start_app.py -f json -o reports/bandit.json --exit-zero
      - name: Reject medium and high findings
        run: bandit -r app scripts start_app.py --severity-level medium --confidence-level medium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: bandit-report
          path: reports/bandit.json
          retention-days: 7

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep==1.178.0 opentelemetry-instrumentation-requests==0.58b0
      - run: mkdir -p reports
      - name: Collect Python and security audit findings
        run: >-
          semgrep scan --config p/python --config p/security-audit
          --metrics off --disable-version-check --strict
          --json-output reports/semgrep.json --sarif-output reports/semgrep.sarif
          app scripts start_app.py
      - name: Reject error-level findings
        run: >-
          semgrep scan --config p/python --config p/security-audit
          --metrics off --disable-version-check --strict --severity ERROR --error
          app scripts start_app.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: semgrep-report
          path: reports/semgrep.*
          retention-days: 7

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip setuptools
      - name: Install CPU PyTorch before resolving application dependencies
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pip install pip-audit==2.10.1
      - run: mkdir -p reports
      - name: Verify enforced Chroma security scope with the real backend
        run: python -m pytest tests/test_chroma_security.py -q
      - name: Audit environment and assess deployment applicability
        run: |
          python scripts/export_audit_inventory.py --inventory reports/installed-packages.json --requirements reports/audited-packages.txt
          audit_status=0
          python -m pip_audit -r reports/audited-packages.txt --no-deps --disable-pip --progress-spinner off --format json --output reports/pip-audit.json || audit_status=$?
          python scripts/check_dependency_audit.py --report reports/pip-audit.json --review security/dependency-reviews.json --output reports/dependency-assessment.json --audit-exit-code "$audit_status"
      - name: Summarize dependency findings
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('reports/pip-audit.json')
          if path.exists():
              for dependency in json.loads(path.read_text())['dependencies']:
                  for finding in dependency.get('vulns', []):
                      fixes = ', '.join(finding.get('fix_versions', [])) or 'not reported'
                      print(f"{dependency['name']} {dependency['version']}: {finding['id']}; fixed versions: {fixes}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: dependency-report
          path: |
            reports/pip-audit.json
            reports/dependency-assessment.json
            reports/installed-packages.json
            reports/audited-packages.txt
          retention-days: 7

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mkdir -p reports
      - name: Scan Git history with redacted findings
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact=100 --report-format json
          --report-path /repo/reports/gitleaks.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: secrets-report
          path: reports/gitleaks.json
          retention-days: 7

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [lint, tests, bandit, semgrep, dependencies, secrets]
    env:
      CHECK_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every check to succeed
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ['CHECK_RESULTS'])
          failed = [name for name, check in results.items() if check['result'] != 'success']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## CI checks\n\n')
              for name, check in results.items():
                  summary.write(f"- {name}: {check['result']}\n")
          if failed:
              print('Failed or incomplete checks: ' + ', '.join(failed))
              sys.exit(1)
          PY
